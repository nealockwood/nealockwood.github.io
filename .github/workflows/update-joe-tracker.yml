name: Update JOE tracker page

on:
  workflow_dispatch:
  schedule:
    # Saturday 12:15 UTC (8:15 AM EDT / 7:15 AM EST), after the week's listings post
    - cron: "15 12 * * 6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Pages repo
        uses: actions/checkout@v4
        with:
          # Full history so the rebase-on-push-rejection below is well defined.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas openpyxl

      - name: Download AEA JOE result sets
        run: python scripts/fetch-aea-joe-data.py --start-year 2015 --end-year "$(date +%Y)" --output-dir joe-data

      - name: Build Pages data
        run: python scripts/build-joe-tracker-data.py --source-data-dir joe-data --min-academic-year 2015 --output pages/joe-tracker-data.json

      - name: Commit update
        run: |
          if git diff --quiet -- pages/joe-tracker-data.json; then
            echo "No JOE tracker data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/joe-tracker-data.json
          git commit -m "Update JOE tracker data"
          # The Twitter dashboard bot pushes to main about once an hour, so the
          # base can move while the fetch/build steps run. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git pull --rebase
          done
          echo "Could not push after 5 attempts."
          exit 1
