<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ED Propagation Profiles</title>
    <style>
:root {
  color-scheme: light;
  --bg: #f6f7f4;
  --panel: #ffffff;
  --ink: #1f2623;
  --muted: #65716d;
  --line: #dfe4de;
  --line-strong: #cbd3cc;
  --accent: #276b7c;
  --accent-2: #2f74b5;
  --fit: #121614;
  --danger: #9a3412;
  --shadow: 0 14px 34px rgba(32, 38, 35, 0.08);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0;
}

button,
input,
select {
  font: inherit;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 22px 28px 18px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.76);
}

h1,
h2,
p {
  margin: 0;
}

h1 {
  font-size: clamp(24px, 3vw, 34px);
  line-height: 1.05;
  font-weight: 720;
}

h2 {
  font-size: 20px;
  line-height: 1.2;
  font-weight: 700;
}

.meta {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.source-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none;
  background: #fff;
  white-space: nowrap;
}


.source-link:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.app-grid {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 18px;
  padding: 18px;
}

.controls,
.chart-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.controls {
  align-self: start;
  padding: 16px;
}

.control-block + .control-block {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
}

.control-label {
  display: block;
  margin-bottom: 8px;
  color: #39433f;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 3px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #f7f8f5;
}

.segmented button {
  min-height: 34px;
  border: 0;
  border-radius: 6px;
  color: var(--muted);
  background: transparent;
  cursor: pointer;
}

.segmented button.is-active {
  color: var(--ink);
  background: #fff;
  box-shadow: 0 1px 3px rgba(28, 33, 31, 0.12);
}

.inline-control {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
}

input,
select {
  width: 100%;
  min-height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
}

input {
  padding: 0 10px;
}

select {
  padding: 0 8px;
}

.date-stepper {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr) 38px;
  gap: 8px;
}

.date-stepper button {
  width: 38px;
  padding: 0;
  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}

.date-stepper button:disabled {
  color: #a5ada9;
  background: #f4f6f3;
  cursor: default;
}

.reset-date {
  width: 100%;
  margin-top: 8px;
  color: #234562;
  background: #f7fbff;
}

.reset-date:disabled {
  color: #a5ada9;
  background: #f4f6f3;
  cursor: default;
}

button {
  min-height: 38px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--ink);
  background: #fff;
  cursor: pointer;
}

button:hover {
  border-color: var(--accent);
}

.inline-control button {
  padding: 0 12px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 32px;
  color: #37423e;
  cursor: pointer;
}

.check-row input {
  width: 16px;
  min-height: 16px;
  accent-color: var(--accent);
}

.metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 18px;
}

.metric {
  min-height: 68px;
  padding: 11px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
}

.metric-wide {
  grid-column: 1 / -1;
}

.metric span {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.metric strong {
  display: block;
  margin-top: 4px;
  color: var(--ink);
  font-size: 18px;
  font-weight: 720;
}

.metric-wide strong {
  font-size: 13px;
  line-height: 1.35;
}

.chart-panel {
  min-width: 0;
  padding: 18px 18px 16px;
}

.chart-header {
  display: flex;
  align-items: start;
  justify-content: space-between;
  gap: 16px;
  min-height: 56px;
}

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

.legend-item {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 28px;
  padding: 0 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  color: #44504b;
  background: #fbfcfa;
  font-size: 12px;
}

.legend-line {
  width: 24px;
  height: 0;
  border-top: 3px solid currentColor;
}

.legend-line.average {
  color: var(--accent);
}

.legend-line.base {
  color: #8a9691;
  border-top-style: dashed;
}

.legend-line.modified {
  color: var(--accent-2);
}

.legend-line.fit {
  color: var(--fit);
}

.legend-line.pca {
  color: #b8590a;
}

.error {
  margin: 8px 0 10px;
  padding: 10px 12px;
  border: 1px solid #f1bda7;
  border-radius: 8px;
  color: var(--danger);
  background: #fff7ed;
  font-size: 13px;
}

.graph-options {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  margin: 8px 0 12px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
}

.graph-options .check-row {
  min-height: 28px;
}

.plot-options {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
  margin: 12px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
}

.plot-options .check-row {
  min-height: 28px;
}

.fit-panel {
  margin: 8px 0 12px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
}

.fit-equation {
  overflow-wrap: anywhere;
  color: var(--ink);
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: clamp(24px, 4vw, 46px);
  font-weight: 760;
  line-height: 1.12;
}

.fit-details,
.save-status {
  margin-top: 8px;
  color: var(--muted);
  font-size: 13px;
}

.save-status {
  color: #43514c;
}

.chart {
  width: 100%;
  min-height: 520px;
}

.chart svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 520px;
}

.axis text {
  fill: #56625e;
  font-size: 13px;
}

.axis-label {
  fill: #2e3733;
  font-size: 14px;
  font-weight: 650;
}

.grid-line {
  stroke: #dce3dd;
  stroke-width: 1;
}

.zero-line {
  stroke: #707a76;
  stroke-width: 1.15;
}

.profile-line {
  fill: none;
  pointer-events: stroke;
  transition: opacity 120ms ease, stroke-width 120ms ease;
}

.profile-line:hover,
.profile-line.is-active {
  opacity: 1;
  stroke-width: 3.2;
}

.overlay-line {
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.average-line {
  stroke: var(--accent);
  stroke-width: 3;
}

.base-line {
  stroke: #8a9691;
  stroke-width: 2.2;
  stroke-dasharray: 7 6;
}

.modified-line {
  stroke: var(--accent-2);
  stroke-width: 2.8;
}

.fit-line {
  stroke: var(--fit);
  stroke-width: 4;
}

.pca-line {
  stroke: #b8590a;
  stroke-width: 3.4;
  stroke-dasharray: 2 5;
  stroke-linecap: round;
}

.point {
  fill: #fff;
  stroke-width: 2;
}

.base-point {
  fill: #fff;
  stroke: #8a9691;
  stroke-width: 2.2;
}

.modified-point {
  fill: var(--accent-2);
  stroke: #fff;
  stroke-width: 2.4;
  cursor: ns-resize;
  filter: drop-shadow(0 2px 4px rgba(31, 38, 35, 0.22));
}

.modified-point:hover,
.modified-point.is-dragging {
  fill: var(--fit);
}

.modified-point.readonly-point {
  cursor: default;
  fill: #5c88b3;
}

.hist-panel {
  margin-top: 16px;
  border-top: 1px solid var(--line);
  padding-top: 16px;
}

.hist-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 12px;
}

.hist-header h3 {
  margin: 0;
  font-size: 18px;
  line-height: 1.2;
}

.hist-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.hist-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fbfcfa;
  padding: 12px;
}

.hist-card h4 {
  margin: 0;
  font-size: 15px;
  line-height: 1.2;
}

.hist-formula {
  margin-top: 4px;
  color: var(--muted);
  font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  font-size: 12px;
}

.hist-pair {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  margin-top: 12px;
}

.hist-block {
  min-width: 0;
}

.hist-title {
  margin-bottom: 6px;
  color: #34403b;
  font-size: 13px;
  font-weight: 700;
}

.hist-svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.hist-bar {
  fill: rgba(47, 116, 181, 0.72);
}

.hist-zero {
  stroke: #111;
  stroke-width: 1.2;
  stroke-dasharray: 4 4;
}

.hist-axis,
.hist-tick {
  stroke: #87918d;
  stroke-width: 1;
}

.hist-axis-text,
.hist-empty {
  fill: var(--muted);
  font-size: 11px;
}

.hist-axis-label {
  fill: #34403b;
  font-size: 12px;
  font-weight: 700;
}

.joint-plot {
  margin-top: 12px;
}

.joint-svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}

.joint-cell {
  fill: var(--accent);
}

.joint-point {
  fill: rgba(18, 22, 20, 0.42);
  stroke: #fff;
  stroke-width: 0.6;
}

.joint-fit-label-bg {
  fill: rgba(255, 255, 255, 0.9);
  stroke: var(--line);
}

.joint-fit-label {
  fill: #111614;
  font-size: 12px;
  font-weight: 700;
}

.hist-stats {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.35;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 420px;
  color: var(--muted);
  border: 1px dashed var(--line-strong);
  border-radius: 8px;
}

@media (max-width: 860px) {
  .topbar {
    align-items: flex-start;
    flex-direction: column;
    gap: 12px;
    padding: 18px;
  }

  .app-grid {
    grid-template-columns: 1fr;
    padding: 12px;
  }

  .controls {
    position: static;
  }

  .chart {
    min-height: 420px;
    overflow-x: auto;
  }

  .chart svg {
    min-width: 760px;
    min-height: 420px;
  }

  .chart-header {
    flex-direction: column;
    align-items: stretch;
  }

  .legend {
    justify-content: flex-start;
  }

  .fit-equation {
    font-size: 24px;
  }

  .hist-grid {
    grid-template-columns: 1fr;
  }
}

    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>ED propagation profiles</h1>
        <p id="sourceMeta" class="meta">Loading data...</p>
      </div>
      <a class="source-link" href="https://github.com/mindcraft1997/termprop" target="_blank" rel="noreferrer">Source</a>
    </header>

    <main class="app-grid">
      <aside class="controls" aria-label="Plot controls">
        <section class="control-block">
          <label class="control-label">Selection</label>
          <div class="segmented" aria-label="Selection mode">
            <button id="modeRange" class="is-active" type="button">Range</button>
            <button id="modeDate" type="button">Date</button>
          </div>
        </section>

        <section class="control-block">
          <label class="control-label" for="rangeInput">Year range</label>
          <div class="inline-control">
            <input id="rangeInput" type="text" value="1993 onward" inputmode="text" autocomplete="off">
            <button id="applyRange" type="button">Apply</button>
          </div>
        </section>

        <section class="control-block">
          <label class="control-label" for="dateSelect">Meeting date</label>
          <div class="date-stepper">
            <button id="prevDate" type="button" aria-label="Previous meeting date" title="Previous meeting date">&lt;</button>
            <select id="dateSelect"></select>
            <button id="nextDate" type="button" aria-label="Next meeting date" title="Next meeting date">&gt;</button>
          </div>
          <button id="resetDate" class="reset-date" type="button">Reset date to Base</button>
        </section>

        <section class="metrics" aria-label="Sample summary">
          <div class="metric">
            <span>Selected</span>
            <strong id="selectedCount">--</strong>
          </div>
          <div class="metric">
            <span>Sample</span>
            <strong id="sampleWindow">--</strong>
          </div>
          <div class="metric metric-wide">
            <span>Coverage</span>
            <strong id="coverageText">--</strong>
          </div>
        </section>
      </aside>

      <section class="chart-panel" aria-label="Normalized propagation chart">
        <div class="chart-header">
          <div>
            <h2 id="plotTitle">1993 onward</h2>
            <p id="plotSubtitle" class="meta">Normalized to ED2 = 12.5 bp</p>
          </div>
          <div id="legend" class="legend"></div>
        </div>
        <div id="errorBanner" class="error" hidden></div>
        <section class="graph-options" aria-label="Graph units">
          <label class="check-row">
            <input id="showActualUnits" type="checkbox">
            <span>Actual realized units</span>
          </label>
          <label class="check-row">
            <input id="includeFf2" type="checkbox">
            <span>Include FF2</span>
          </label>
          <label class="check-row">
            <input id="showPca" type="checkbox">
            <span>Overlay GSS PC fit</span>
          </label>
          <label class="check-row">
            <input id="onePc" type="checkbox">
            <span>PC1 only</span>
          </label>
        </section>
        <section id="fitPanel" class="fit-panel" hidden>
          <div id="fitEquation" class="fit-equation"></div>
          <p id="fitDetails" class="fit-details"></p>
          <p id="saveStatus" class="save-status"></p>
        </section>
        <div id="chart" class="chart" role="img" aria-label="Line chart of normalized ED propagation profiles"></div>
        <section class="plot-options" aria-label="Plot options">
          <label class="check-row">
            <input id="showMidpointSlope" type="checkbox">
            <span>Joint: midpoint slope</span>
          </label>
          <label class="check-row">
            <input id="excludeZlb" type="checkbox">
            <span>Exclude ZLB</span>
          </label>
        </section>
        <section class="hist-panel" aria-label="Coefficient histograms">
          <div class="hist-header">
            <div>
              <h3>Coefficient distributions</h3>
              <p id="histMeta" class="meta">Modified fits for the selected range</p>
            </div>
          </div>
          <div class="hist-grid">
            <article class="hist-card">
              <h4>Raw unconstrained fit</h4>
              <p class="hist-formula">y = a*x^2 + b*x + c</p>
              <div id="rawHistograms" class="hist-pair"></div>
            </article>
            <article class="hist-card">
              <h4 id="jointTitle">Raw joint distribution</h4>
              <p id="jointFormula" class="hist-formula">x-axis: a, y-axis: b</p>
              <div id="jointDistribution" class="joint-plot"></div>
            </article>
          </div>
        </section>
      </section>
    </main>

          return Array.from(groups.entries())
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([date, items]) => {
              const edItems = ED_HORIZONS.map((horizon) => items.find((item) => item.Horizon === horizon) || {});
              const ff2Item = items.find((item) => item.Horizon === FF2_HORIZON) || {};
              const coefSource = edItems[0] || {};
              return {
                date,
                label: labelDate(date),
                year: Number(date.slice(0, 4)),
                base: edItems.map((item) => numberOrNull(item.Base)),
                modified: edItems.map((item) => numberOrNull(item.Modified)),
                baseFit: edItems.map((item) => numberOrNull(item.BaseFit)),
                modifiedFit: edItems.map((item) => numberOrNull(item.ModifiedFit)),
                baseCoefficients: [numberOrNull(coefSource.BaseCoefA), numberOrNull(coefSource.BaseCoefB), numberOrNull(coefSource.BaseCoefC)],
                modifiedCoefficients: [numberOrNull(coefSource.ModifiedCoefA), numberOrNull(coefSource.ModifiedCoefB), numberOrNull(coefSource.ModifiedCoefC)],
                sourceEd2: numberOrNull(coefSource.SourceED2),
                sourceValues: edItems.map((item) => numberOrNull(item.SourceValue)),
                ff2Base: numberOrNull(ff2Item.Base),
                ff2Modified: numberOrNull(ff2Item.Modified),
                ff2Source: numberOrNull(ff2Item.SourceValue),
                updatedAt: items.reduce((latest, item) => item.UpdatedAt > latest ? item.UpdatedAt : latest, ""),

            });
        }

        function applyLocalFit(row) {
          const fit = fitQuadratic(row.modified);
          row.modifiedFit = fit.fit;
          row.modifiedCoefficients = fit.coefficients;
        }

        function fitQuadratic(values) {
          const points = values.map((value, index) => Number.isFinite(value) ? [index, value] : null).filter(Boolean);
          if (points.length < 3) return { fit: values.map(() => null), coefficients: [null, null, null] };
          const sx0 = points.length;
          const sx1 = points.reduce((sum, point) => sum + point[0], 0);
          const sx2 = points.reduce((sum, point) => sum + point[0] ** 2, 0);
          const sx3 = points.reduce((sum, point) => sum + point[0] ** 3, 0);
          const sx4 = points.reduce((sum, point) => sum + point[0] ** 4, 0);
          const sy0 = points.reduce((sum, point) => sum + point[1], 0);
          const sy1 = points.reduce((sum, point) => sum + point[0] * point[1], 0);
          const sy2 = points.reduce((sum, point) => sum + point[0] ** 2 * point[1], 0);
          const coefficients = solve3x3([[sx4, sx3, sx2], [sx3, sx2, sx1], [sx2, sx1, sx0]], [sy2, sy1, sy0]);
          if (!coefficients.every(Number.isFinite)) return { fit: values.map(() => null), coefficients: [null, null, null] };
          return {
            coefficients,
            fit: values.map((value, index) => Number.isFinite(value) ? coefficients[0] * index * index + coefficients[1] * index + coefficients[2] : null),
          };
        }

        function solve3x3(matrix, vector) {
          const rows = matrix.map((row, index) => row.slice().concat(vector[index]));
          for (let pivot = 0; pivot < 3; pivot += 1) {
            let best = pivot;
            for (let row = pivot + 1; row < 3; row += 1) {
              if (Math.abs(rows[row][pivot]) > Math.abs(rows[best][pivot])) best = row;
            }
            if (Math.abs(rows[best][pivot]) < 1e-12) return [null, null, null];
            [rows[pivot], rows[best]] = [rows[best], rows[pivot]];
            const scale = rows[pivot][pivot];
            for (let col = pivot; col < 4; col += 1) rows[pivot][col] /= scale;
            for (let row = 0; row < 3; row += 1) {
              if (row === pivot) continue;
              const factor = rows[row][pivot];
              for (let col = pivot; col < 4; col += 1) rows[row][col] -= factor * rows[pivot][col];
            }
          }
          return [rows[0][3], rows[1][3], rows[2][3]];
        }

        function parseCsv(text) {
          const rows = [];
          let row = [];
          let field = "";
          let quoted = false;
          for (let i = 0; i < text.length; i += 1) {
            const char = text[i];
            const next = text[i + 1];
            if (quoted) {
              if (char === '"' && next === '"') {
                field += '"';
                i += 1;
              } else if (char === '"') {
                quoted = false;
              } else {
                field += char;
              }
            } else if (char === '"') {
              quoted = true;
            } else if (char === ",") {
              row.push(field);
              field = "";
            } else if (char === "\n") {
              row.push(field);
              rows.push(row);
              row = [];
              field = "";
            } else if (char !== "\r") {
              field += char;
            }
          }
          if (field || row.length) {
            row.push(field);
            rows.push(row);
          }
          const headers = rows.shift() || [];
          return rows.filter((values) => values.length && values.some(Boolean)).map((values) => {
            const object = {};
            headers.forEach((header, index) => { object[header] = values[index] || ""; });
            return object;
          });
        }

        function readAdjustments() {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
          } catch (_) {
            return {};
          }
        }

        function jsonResponse(payload) {
          return new Response(JSON.stringify(payload), {
            status: 200,
            headers: { "Content-Type": "application/json; charset=utf-8" },
          });
        }

        function numberOrNull(value) {
          const number = Number(value);
          return Number.isFinite(number) ? number : null;
        }

        function labelDate(value) {
          const date = new Date(value + "T00:00:00");
          return date.toLocaleDateString("en-US", { month: "short", day: "2-digit", year: "numeric" });

    <script>
(function () {

    ["2009-01-01", "2015-12-31"],

  const state = {
    rows: [],
    mode: "range",
    selectedDate: "",
    lastRows: [],
    csvPath: "",
    saving: false,
    includeFf2: false,
    showPca: false,
    onePc: false,
    pca: null,
  };

  const el = {};

  function syncHorizons() {
    HORIZONS = state.includeFf2 ? FF2_PLUS_ED_HORIZONS.slice() : ED_HORIZONS.slice();
  }

  function effBase(row) {
    if (!state.includeFf2) return row.base;
    return [Number.isFinite(row.ff2Base) ? row.ff2Base : null, ...row.base];
  }

  function effModified(row) {
    if (!state.includeFf2) return row.modified;
    return [Number.isFinite(row.ff2Modified) ? row.ff2Modified : null, ...row.modified];
  }

  function setEffModified(row, index, value) {
    if (state.includeFf2) {
      if (index === 0) {
        row.ff2Modified = value;
      } else {
        row.modified[index - 1] = value;
      }
    } else {
      row.modified[index] = value;
    }
  }

  function effCoefficients(row) {
    if (state.includeFf2) {
      const fit = fitQuadratic(effModified(row));
      return fit.coefficients;
    }
    return row.modifiedCoefficients;
  }

  function rowHasFiniteModified(row) {
    return effModified(row).every(Number.isFinite);

  function midpointSlopeLabel() {

  }

  document.addEventListener("DOMContentLoaded", init);

  async function init() {
    cacheElements();
    bindEvents();

    try {
      const payload = await fetchJson("/api/data");
      state.rows = payload.rows || [];
      state.csvPath = payload.csvPath || "";
      populateDates(state.rows);
      state.selectedDate = state.rows.length ? state.rows[state.rows.length - 1].date : "";
      el.dateSelect.value = state.selectedDate;
      el.sourceMeta.textContent = sourceSummary(state.rows);
      render();
    } catch (error) {
      showError(`Could not load data: ${error.message}`);
      el.sourceMeta.textContent = "Data load failed";
      renderEmpty("No data loaded.");
    }
  }

  function cacheElements() {
    [
      "sourceMeta",
      "modeRange",
      "modeDate",
      "rangeInput",
      "applyRange",
      "prevDate",
      "dateSelect",
      "nextDate",
      "resetDate",
      "showActualUnits",
      "includeFf2",
      "showPca",
      "onePc",
      "showMidpointSlope",
      "excludeZlb",
      "selectedCount",
      "sampleWindow",
      "coverageText",
      "plotTitle",
      "plotSubtitle",
      "legend",
      "errorBanner",
      "fitPanel",
      "fitEquation",
      "fitDetails",
      "saveStatus",
      "chart",
      "histMeta",
      "jointTitle",
      "jointFormula",
      "rawHistograms",
      "jointDistribution",
    ].forEach((id) => {
      el[id] = document.getElementById(id);
    });
  }

  function bindEvents() {
    el.modeRange.addEventListener("click", () => {
      state.mode = "range";
      render();
    });

    el.modeDate.addEventListener("click", () => {
      state.mode = "date";
      render();
    });

    el.applyRange.addEventListener("click", () => {
      state.mode = "range";
      render();
    });

    el.rangeInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {

        render();
      }
    });

      state.selectedDate = el.dateSelect.value;
      state.mode = "date";
      render();
    });

    el.nextDate.addEventListener("click", () => {
      stepDate(1);

    el.showMidpointSlope.addEventListener("change", render);
    el.excludeZlb.addEventListener("change", render);
    el.includeFf2.addEventListener("change", () => {
      state.includeFf2 = el.includeFf2.checked;
      syncHorizons();
      render();
    });

    el.showPca.addEventListener("change", () => {
      state.showPca = el.showPca.checked;
      render();
    });

    el.onePc.addEventListener("change", () => {
      state.onePc = el.onePc.checked;
      render();
    });
  }

  async function fetchJson(url, options) {
    const response = await fetch(url, options);
    const payload = await response.json();
    if (!response.ok) {
      throw new Error(payload.error || `${response.status} ${response.statusText}`);
    }
    return payload;
  }

  function populateDates(rows) {
    el.dateSelect.innerHTML = "";
    rows.forEach((row) => {
      const option = document.createElement("option");
      option.value = row.date;
      option.textContent = row.label;
      el.dateSelect.appendChild(option);
    });
  }

  function render() {
    syncDateOptions();
    updateModeButtons();
    hideError();
    refreshPca();

    if (!activeRows().length) {
      renderEmpty("No eligible observations.");
      updateMetrics([]);
      renderCoefficientHistograms([]);
      hideFitPanel();
      return;
    }

    const selection = getSelection();
    if (selection.error) {
      showError(selection.error);
    }

    state.lastRows = selection.rows;
    el.plotTitle.textContent = selection.title;
    el.plotSubtitle.textContent = selection.subtitle;

    updateMetrics(selection.rows);
    renderLegend(selection.rows);

    if (state.mode === "date" && selection.rows.length) {
      renderDateChart(selection.rows[0]);
      showFitPanel(selection.rows[0]);
      renderCoefficientHistograms(rangeRowsForHistograms());
    } else {
      renderRangeChart(selection.rows);
      hideFitPanel();
      renderCoefficientHistograms(selection.rows);
    }
  }

  function getSelection() {
    const rowsForSelection = activeRows();
    if (state.mode === "date") {
      const row = rowsForSelection.find((item) => item.date === state.selectedDate) || rowsForSelection[rowsForSelection.length - 1];
      state.selectedDate = row.date;
      el.dateSelect.value = row.date;
      return {
        rows: [row],
        title: row.label,
        subtitle: showActualUnits()
          ? `Actual realized bp units; editing disabled${zlbSuffix()}`
          : `Drag the Modified dots vertically; release to save in this browser${zlbSuffix()}`,
        error: "",
      };
    }

    const parsed = parseYearRange(el.rangeInput.value);
    if (parsed.error) {
      return {
        rows: [],
        title: "Invalid range",
        subtitle: `ED2 normalized to ${TARGET_BP.toFixed(1)} bp`,
        error: parsed.error,
      };
    }

    const rows = rowsForSelection.filter((row) => row.year >= parsed.start && row.year <= parsed.end);
    const title = parsed.openEnded
      ? `${parsed.start} onward`
      : parsed.start === parsed.end ? `${parsed.start}` : `${parsed.start}-${parsed.end}`;
    return {
      rows,
      title,
      subtitle: `${rows.length} observations, Modified profiles shown${actualUnitsSuffix()}${zlbSuffix()}`,
      error: rows.length ? "" : "No eligible observations in that year range.",
    };
  }

  function actualUnitsSuffix() {
    return showActualUnits() ? "; actual realized bp units" : "";
  }

  function zlbSuffix() {
    return el.excludeZlb.checked ? "; ZLB excluded" : "";
  }

  function parseYearRange(value) {
    const text = value.trim();
    const maxYear = state.rows.length ? state.rows[state.rows.length - 1].year : new Date().getFullYear();
    const openEndedMatch = text.match(/^(\d{4})\s*(?:\+|-|onward|forward|present|now)$/i);

    if (openEndedMatch) {
      const start = Number(openEndedMatch[1]);
      return { start, end: maxYear, openEnded: true, error: "" };
    }

    const match = text.match(/^(\d{4})(?:\s*(?:-|:|,|to)\s*(\d{4}))?$/i);
    if (!match) {
      return { error: "Use a four-digit year, an open-ended year like 1993 onward, or an inclusive range like 1994-1997." };
    }

    let start = Number(match[1]);
    let end = Number(match[2] || match[1]);
    if (start > end) {
      [start, end] = [end, start];

    if (end < 1993) {
      return { error: "The app uses observations from 1993 onward." };
    }

    return { start, end, openEnded: false, error: "" };

  function stepDate(direction) {
    const rows = activeRows();
    if (!rows.length) {
      return;

    let index = rows.findIndex((row) => row.date === state.selectedDate);
    if (index < 0) {
      index = rows.length - 1;
    }

    const nextIndex = Math.min(Math.max(index + direction, 0), rows.length - 1);
    state.selectedDate = rows[nextIndex].date;
    el.dateSelect.value = state.selectedDate;
    state.mode = "date";
    render();
  }

    let row = state.rows.find((item) => item.date === state.selectedDate);
    if (!row) {

      state.selectedDate = row.date;
      el.dateSelect.value = row.date;

    row.ff2Modified = Number.isFinite(row.ff2Base) ? row.ff2Base : null;

    state.mode = "date";

  function updateModeButtons() {

  function updateDateStepper() {

  }

  function activeRows() {

  function isZlbDate(date) {

  function syncDateOptions() {

    populateDates(rows);
    if (!rows.length) {

      return;
    }
    if (!rows.some((row) => row.date === state.selectedDate)) {

  function showActualUnits() {

  function isDateModified(row) {

      if (!Number.isFinite(baseValue) && !Number.isFinite(modifiedValue)) {

      return Math.abs((modifiedValue || 0) - (baseValue || 0)) > 1e-9;

  }

  function updateMetrics(rows) {

  function coverageText(rows) {

      return `${name} ${count}/${rows.length}`;

  function renderLegend(rows) {

    if (state.mode === "date") {

  function legendItem(label, kind) {

    item.className = "legend-item";

    const line = document.createElement("span");

  function renderRangeChart(rows) {
    el.chart.innerHTML = "";
    if (!rows.length) {

      return;

    const dims = chartDimensions();
    const displayRows = rows.map((row) => ({

    el.chart.innerHTML = "";

    const dims = chartDimensions();

    if (view.pcaFit) overlayValues.push(...view.pcaFit);

    const scale = makeScale(dims, domain);
    const ticks = niceTicks(domain[0], domain[1], 7);

      scale,
      modifiedPath,
      fitPath,

    drawAxes(svg, ticks, scale, dims, yAxisLabel());
    el.chart.appendChild(svg);
  }

  function dateDisplayView(row) {
    const base = displayValues(row, effBase(row));
    const modified = displayValues(row, effModified(row));
    const fit = fitQuadratic(modified);
    const pcaResult = state.showPca ? pcaFitForRow(row) : null;
    return {
      base,
      modified,
      modifiedFit: fit.fit,
      modifiedCoefficients: fit.coefficients,
      pcaFit: pcaResult ? displayValues(row, pcaResult.fit) : null,
    };
  }

  function displayValues(row, values) {
    if (!showActualUnits()) {
      return values.map((value) => Number.isFinite(value) ? value : null);
    }

    const scale = actualScale(row);
    return values.map((value) => Number.isFinite(value) ? value * scale : null);
  }

  function actualScale(row) {
    return Number.isFinite(row.sourceEd2) ? (row.sourceEd2 * 100) / TARGET_BP : 1;
  }

  function yAxisLabel() {
    return showActualUnits() ? "Realized revision, bp" : "Normalized revision, bp";
  }

  function drawRangeProfiles(svg, rows, scale) {
    const group = svgEl("g", { class: "profiles" });
    const opacity = rows.length > 80 ? 0.42 : rows.length > 35 ? 0.56 : 0.74;
    const width = rows.length > 80 ? 1.15 : rows.length > 35 ? 1.25 : 1.45;

    rows.forEach((row, index) => {
      const path = svgEl("path", {
        d: pathFor(row.modified, scale),
        class: "profile-line",
        stroke: colorFor(index, rows.length),
        "stroke-width": width,
        "stroke-opacity": opacity,
        "stroke-linecap": "round",
        "stroke-linejoin": "round",
      });
      const title = svgEl("title");
      title.textContent = `${row.label}\n${seriesLabel(row.modified)}`;
      path.appendChild(title);
      path.addEventListener("pointerenter", () => {
        path.classList.add("is-active");
      });
      path.addEventListener("pointerleave", () => {
        path.classList.remove("is-active");
      });
      group.appendChild(path);
    });

    svg.appendChild(group);
  }

  function drawPointLayer(svg, row, values, scale, className, draggable, dragContext) {
    const group = svgEl("g", { class: `${className}-layer` });
    values.forEach((value, index) => {
      if (!Number.isFinite(value)) {
        return;
      }

      const point = svgEl("circle", {
        cx: scale.x(index),
        cy: scale.y(value),
        r: draggable ? 8 : 4.8,
        class: `${className}${!draggable && className === "modified-point" ? " readonly-point" : ""}`,
        tabindex: draggable ? "0" : "-1",
      });
      const title = svgEl("title");
      title.textContent = `${HORIZONS[index]}: ${formatBp(value)} bp`;
      point.appendChild(title);

      if (draggable) {
        attachDrag(point, row, index, dragContext);
      }

      group.appendChild(point);
    });
    svg.appendChild(group);
  }

  function attachDrag(point, row, index, context) {
    let dragging = false;

    point.addEventListener("pointerdown", (event) => {
      dragging = true;
      point.setPointerCapture(event.pointerId);
      point.classList.add("is-dragging");
      event.preventDefault();
    });

    point.addEventListener("pointermove", (event) => {
      if (!dragging) {
        return;
      }
      const svg = point.ownerSVGElement;
      const pt = svg.createSVGPoint();
      pt.x = event.clientX;
      pt.y = event.clientY;
      const local = pt.matrixTransform(svg.getScreenCTM().inverse());
      const value = clamp(context.scale.value(local.y), context.domain[0], context.domain[1]);
      setEffModified(row, index, value);
      applyLocalFit(row);

      point.setAttribute("cy", context.scale.y(value));
      point.querySelector("title").textContent = `${HORIZONS[index]}: ${formatBp(value)} bp`;
      context.modifiedPath.setAttribute("d", pathFor(effModified(row), context.scale));
      if (context.fitPath) {
        context.fitPath.setAttribute("d", fitPathFor(effCoefficients(row), effModified(row), context.scale));
      }
      if (context.pcaPath) {
        const live = pcaFitForRow(row);
        const display = live ? displayValues(row, live.fit) : null;
        context.pcaPath.setAttribute("d", display ? pathFor(display, context.scale) : "");
      }
      showFitPanel(row);
    });

    point.addEventListener("pointerup", async (event) => {
      if (!dragging) {
        return;
      }
      dragging = false;
      point.classList.remove("is-dragging");
      point.releasePointerCapture(event.pointerId);
      await saveDate(row);
    });

    point.addEventListener("pointercancel", () => {
      dragging = false;
      point.classList.remove("is-dragging");
    });
  }

  async function saveDate(row) {
    if (state.saving) {
      return;
    }

    state.saving = true;
    setSaveStatus("Saving...");
    try {
      const payload = await fetchJson("/api/adjust", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          date: row.date,
          modified: row.modified,
          ff2Modified: row.ff2Modified,
        }),
      });
      const nextRow = payload.row;
      const index = state.rows.findIndex((item) => item.date === nextRow.date);
      if (index >= 0) {
        state.rows[index] = nextRow;
      }
      state.csvPath = payload.csvPath || state.csvPath;
      setSaveStatus(`Saved to ${state.csvPath}`);
      render();
    } catch (error) {
      showError(`Could not save adjustment: ${error.message}`);
      setSaveStatus("Save failed");
    } finally {
      state.saving = false;
    }
  }

  function drawGrid(svg, ticks, scale, dims) {
    ticks.forEach((tick) => {
      svg.appendChild(svgEl("line", {
        x1: dims.margin.left,
        x2: dims.width - dims.margin.right,

  function drawOverlay(svg, values, scale, className, label) {

      d: pathFor(values, scale),

    });

    });

  function chartDimensions() {
    const width = 980;
    const height = 560;
    const margin = { top: 28, right: 34, bottom: 72, left: 76 };
    return {
      width,
      height,
      margin,
      innerWidth: width - margin.left - margin.right,
      innerHeight: height - margin.top - margin.bottom,
    };
  }

  function makeScale(dims, domain) {
    return {
      x: (index) => dims.margin.left + (index * dims.innerWidth) / (HORIZONS.length - 1),
      y: (value) => dims.margin.top + ((domain[1] - value) / (domain[1] - domain[0])) * dims.innerHeight,
      value: (screenY) => domain[1] - ((screenY - dims.margin.top) / dims.innerHeight) * (domain[1] - domain[0]),
    };
  }

  function pathFor(values, scale) {
    let d = "";
    let drawing = false;
    values.forEach((value, index) => {
      if (!Number.isFinite(value)) {
        drawing = false;
        return;
      }
      d += `${drawing ? "L" : "M"}${scale.x(index).toFixed(2)},${scale.y(value).toFixed(2)} `;
      drawing = true;
    });
    return d.trim();
  }

  function fitPathFor(coefficients, values, scale) {
    if (!hasCoefficients(coefficients)) {
      return "";
    }
    const valid = values.map((value, index) => Number.isFinite(value) ? index : null).filter(Number.isFinite);
    if (!valid.length) {
      return "";
    }

    const start = Math.min(...valid);
    const end = Math.max(...valid);
    const steps = 90;
    let d = "";
    for (let i = 0; i <= steps; i += 1) {
      const xValue = start + ((end - start) * i) / steps;
      const yValue = evalQuadratic(coefficients, xValue);
      const screenX = scale.x(xValue);
      const screenY = scale.y(yValue);
      d += `${i === 0 ? "M" : "L"}${screenX.toFixed(2)},${screenY.toFixed(2)} `;
    }
    return d.trim();
  }

  function applyLocalFit(row) {
    const modified = fitQuadratic(effModified(row));
    row.modifiedFit = modified.fit;
    row.modifiedCoefficients = modified.coefficients;
  }

  function pcaLabel() {
    return state.onePc ? "GSS PC1 fit" : "GSS PC1+PC2 fit";
  }

  function refreshPca() {
    if (!state.showPca) {
      state.pca = null;
      return;
    }
    state.pca = computePca(activeRows());
  }

  function computePca(rows) {
    const n = HORIZONS.length;
    const data = [];
    rows.forEach((row) => {
      const vec = effModified(row);
      if (vec.length === n && vec.every(Number.isFinite)) {
        data.push(vec.slice());
      }
    });
    if (data.length < 3) return null;

    const mean = new Array(n).fill(0);
    data.forEach((row) => row.forEach((v, i) => { mean[i] += v; }));
    for (let i = 0; i < n; i += 1) mean[i] /= data.length;

    const cov = Array.from({ length: n }, () => new Array(n).fill(0));
    data.forEach((row) => {
      for (let i = 0; i < n; i += 1) {
        for (let j = 0; j < n; j += 1) {
          cov[i][j] += (row[i] - mean[i]) * (row[j] - mean[j]);
        }
      }
    });
    const denom = Math.max(1, data.length - 1);
    for (let i = 0; i < n; i += 1) {
      for (let j = 0; j < n; j += 1) cov[i][j] /= denom;
    }

    const matrix = cov.map((row) => row.slice());
    const components = [];
    const maxComponents = state.onePc ? 1 : 2;
    for (let c = 0; c < maxComponents; c += 1) {
      const eig = powerIteration(matrix, c);
      if (!eig) break;
      components.push(eig);
      for (let i = 0; i < n; i += 1) {
        for (let j = 0; j < n; j += 1) {
          matrix[i][j] -= eig.value * eig.vector[i] * eig.vector[j];
        }
      }
    }
    if (!components.length) return null;
    return { mean, components };
  }

  function powerIteration(matrix, seed) {
    const n = matrix.length;
    let v = new Array(n).fill(0).map((_, i) => Math.sin(i + 1 + (seed || 0) * 0.37));
    let norm = Math.sqrt(v.reduce((s, x) => s + x * x, 0));
    if (norm < 1e-12) return null;
    v = v.map((x) => x / norm);
    let value = 0;
    for (let iter = 0; iter < 400; iter += 1) {
      const next = new Array(n).fill(0);
      for (let i = 0; i < n; i += 1) {
        for (let j = 0; j < n; j += 1) next[i] += matrix[i][j] * v[j];
      }
      const nn = Math.sqrt(next.reduce((s, x) => s + x * x, 0));
      if (nn < 1e-14) return null;
      const nv = next.map((x) => x / nn);
      const diff = nv.reduce((s, x, i) => s + Math.abs(x - v[i]), 0);
      v = nv;
      value = nn;
      if (diff < 1e-10) break;
    }
    return { value, vector: v };
  }

  function pcaFitForRow(row) {
    const pca = state.pca;
    if (!pca || !pca.components.length) return null;
    const vec = effModified(row);
    if (vec.length !== pca.mean.length || !vec.every(Number.isFinite)) return null;
    const fit = pca.mean.slice();
    pca.components.forEach((component) => {
      let score = 0;
      for (let i = 0; i < vec.length; i += 1) {
        score += (vec[i] - pca.mean[i]) * component.vector[i];
      }
      for (let i = 0; i < vec.length; i += 1) fit[i] += score * component.vector[i];
    });
    return { fit };
  }


  function fitQuadratic(values) {
    const points = values
      .map((value, index) => Number.isFinite(value) ? [index, value] : null)
      .filter(Boolean);
    if (points.length < 3) {
      return { fit: values.map(() => null), coefficients: [null, null, null] };
    }

    const sx0 = points.length;
    const sx1 = points.reduce((sum, point) => sum + point[0], 0);
    const sx2 = points.reduce((sum, point) => sum + point[0] ** 2, 0);
    const sx3 = points.reduce((sum, point) => sum + point[0] ** 3, 0);
    const sx4 = points.reduce((sum, point) => sum + point[0] ** 4, 0);
    const sy0 = points.reduce((sum, point) => sum + point[1], 0);
    const sy1 = points.reduce((sum, point) => sum + point[0] * point[1], 0);
    const sy2 = points.reduce((sum, point) => sum + point[0] ** 2 * point[1], 0);
    const coefficients = solve3x3(
      [
        [sx4, sx3, sx2],
        [sx3, sx2, sx1],
        [sx2, sx1, sx0],
      ],
      [sy2, sy1, sy0],
    );

    if (!hasCoefficients(coefficients)) {
      return { fit: values.map(() => null), coefficients: [null, null, null] };
    }

    return {
      coefficients,
      fit: values.map((value, index) => Number.isFinite(value) ? evalQuadratic(coefficients, index) : null),
    };
  }

  function solve3x3(matrix, vector) {
    const rows = matrix.map((row, index) => row.slice().concat(vector[index]));
    for (let pivot = 0; pivot < 3; pivot += 1) {
      let best = pivot;
      for (let row = pivot + 1; row < 3; row += 1) {
        if (Math.abs(rows[row][pivot]) > Math.abs(rows[best][pivot])) {
          best = row;
        }
      }
      if (Math.abs(rows[best][pivot]) < 1e-12) {
        return [null, null, null];
      }
      [rows[pivot], rows[best]] = [rows[best], rows[pivot]];
      const scale = rows[pivot][pivot];
      for (let col = pivot; col < 4; col += 1) {
        rows[pivot][col] /= scale;
      }
      for (let row = 0; row < 3; row += 1) {
        if (row === pivot) {
          continue;
        }
        const factor = rows[row][pivot];
        for (let col = pivot; col < 4; col += 1) {
          rows[row][col] -= factor * rows[pivot][col];
        }
      }
    }
    return [rows[0][3], rows[1][3], rows[2][3]];
  }

  function evalQuadratic(coefficients, x) {
    return coefficients[0] * x * x + coefficients[1] * x + coefficients[2];
  }

  function hasCoefficients(coefficients) {
    return Array.isArray(coefficients) && coefficients.every(Number.isFinite);
  }

  function computeAverage(series) {
    return HORIZONS.map((_, index) => {
      const values = series.map((item) => item[index]).filter(Number.isFinite);
      if (!values.length) {
        return null;
      }
      return values.reduce((sum, value) => sum + value, 0) / values.length;
    });
  }

  function renderCoefficientHistograms(rows) {
    const midpointX = (HORIZONS.length - 1) / 2;
    const coefRows = rows.map((row) => ({ row, coef: effCoefficients(row) || [null, null, null] }));
    const rawA = coefRows.map((item) => item.coef[0]).filter(Number.isFinite);
    const rawB = coefRows.map((item) => item.coef[1]).filter(Number.isFinite);
    const useMidpointSlope = el.showMidpointSlope.checked;
    const pairs = coefRows
      .map((item) => ({
        a: item.coef[0],
        y: useMidpointSlope
          ? item.coef[1] + 2 * midpointX * item.coef[0]
          : item.coef[1],
        label: item.row.label,
      }))
      .filter((item) => Number.isFinite(item.a) && Number.isFinite(item.y));

    const coef2x = 2 * midpointX;
    const coef2xLabel = Number.isInteger(coef2x) ? coef2x.toString() : coef2x.toFixed(1);
    const slopeLabel = `b + ${coef2xLabel}a`;
    el.histMeta.textContent = `${rows.length} dates from ${rows.length ? `${rows[0].year}-${rows[rows.length - 1].year}` : "the selected range"}${zlbSuffix()}`;
    el.jointTitle.textContent = useMidpointSlope ? "Curvature vs midpoint slope" : "Raw joint distribution";
    el.jointFormula.textContent = useMidpointSlope ? `x-axis: a, y-axis: ${slopeLabel}` : "x-axis: a, y-axis: b";
    el.rawHistograms.innerHTML = "";
    el.jointDistribution.innerHTML = "";
    el.rawHistograms.appendChild(histogramBlock("a", rawA, "Raw curvature, bp per horizon^2", "raw-a"));
    el.rawHistograms.appendChild(histogramBlock("b", rawB, "Raw slope, bp per horizon", "raw-b"));
    el.jointDistribution.appendChild(jointDistributionBlock(pairs, useMidpointSlope));
  }

  function histogramBlock(label, values, subtitle, className) {
    const block = document.createElement("div");
    block.className = "hist-block";

    const title = document.createElement("div");
    title.className = "hist-title";
    title.textContent = `${label} (${values.length})`;
    block.appendChild(title);

    const svg = drawHistogram(values, className);
    block.appendChild(svg);

    const stats = document.createElement("div");
    stats.className = "hist-stats";
    stats.textContent = values.length
      ? `${subtitle}; mean ${formatCoeff(mean(values))}, sd ${formatCoeff(sd(values))}`
      : "No coefficients available";
    block.appendChild(stats);
    return block;
  }

  function drawHistogram(values, className) {
    const width = 390;
    const height = 220;
    const margin = { top: 14, right: 16, bottom: 38, left: 46 };
    const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, class: `hist-svg ${className}` });

    if (!values.length) {
      const text = svgEl("text", { x: width / 2, y: height / 2, "text-anchor": "middle", class: "hist-empty" });
      text.textContent = "No data";
      svg.appendChild(text);
      return svg;
    }

    const domain = paddedDomain(values);
    const bins = makeBins(values, domain, 24);
    const maxCount = Math.max(...bins.map((bin) => bin.count), 1);
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const x = (value) => margin.left + ((value - domain[0]) / (domain[1] - domain[0])) * innerWidth;
    const y = (count) => margin.top + (1 - count / maxCount) * innerHeight;

    bins.forEach((bin) => {
      const left = x(bin.start);
      const right = x(bin.end);
      svg.appendChild(svgEl("rect", {
        x: left + 1,
        y: y(bin.count),
        width: Math.max(0, right - left - 2),
        height: margin.top + innerHeight - y(bin.count),
        class: "hist-bar",
      }));
    });

    const zeroX = x(0);
    if (zeroX >= margin.left && zeroX <= width - margin.right) {
      svg.appendChild(svgEl("line", {
        x1: zeroX,
        x2: zeroX,
        y1: margin.top,
        y2: margin.top + innerHeight,
        class: "hist-zero",
      }));
    }

    const ticks = niceTicks(domain[0], domain[1], 5);
    ticks.forEach((tick) => {
      const tickX = x(tick);
      const line = svgEl("line", {
        x1: tickX,
        x2: tickX,
        y1: margin.top + innerHeight,
        y2: margin.top + innerHeight + 5,
        class: "hist-tick",
      });
      const text = svgEl("text", {
        x: tickX,
        y: height - 12,
        "text-anchor": "middle",
        class: "hist-axis-text",
      });
      text.textContent = formatCoeff(tick);
      svg.appendChild(line);
      svg.appendChild(text);
    });

    svg.appendChild(svgEl("line", {
      x1: margin.left,
      x2: width - margin.right,
      y1: margin.top + innerHeight,
      y2: margin.top + innerHeight,
      class: "hist-axis",
    }));

    const yLabel = svgEl("text", {
      x: 14,
      y: margin.top + innerHeight / 2,
      transform: `rotate(-90 14 ${margin.top + innerHeight / 2})`,
      "text-anchor": "middle",
      class: "hist-axis-text",
    });
    yLabel.textContent = "count";
    svg.appendChild(yLabel);
    return svg;
  }

  function jointDistributionBlock(pairs, useMidpointSlope) {
    const block = document.createElement("div");
    block.className = "joint-block";
    block.appendChild(drawJointDistribution(pairs, useMidpointSlope));

    const stats = document.createElement("div");
    stats.className = "hist-stats";
    if (pairs.length) {
      const yName = useMidpointSlope ? midpointSlopeLabel() : "b";
      stats.textContent = `${pairs.length} dates. Darker cells mean more dates in that a-${yName} region.`;
    } else {
      stats.textContent = "No joint coefficients available.";
    }
    block.appendChild(stats);
    return block;
  }

  function drawJointDistribution(pairs, useMidpointSlope) {
    const width = 430;
    const height = 470;
    const margin = { top: 16, right: 20, bottom: 54, left: 66 };
    const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, class: "joint-svg" });

    if (!pairs.length) {
      const text = svgEl("text", { x: width / 2, y: height / 2, "text-anchor": "middle", class: "hist-empty" });
      text.textContent = "No data";
      svg.appendChild(text);
      return svg;
    }

    const xDomain = paddedDomain(pairs.map((item) => item.a));
    const yDomainLocal = paddedDomain(pairs.map((item) => item.y));
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    const x = (value) => margin.left + ((value - xDomain[0]) / (xDomain[1] - xDomain[0])) * innerWidth;
    const y = (value) => margin.top + ((yDomainLocal[1] - value) / (yDomainLocal[1] - yDomainLocal[0])) * innerHeight;

    const xBins = 18;
    const yBins = 18;
    const cells = Array.from({ length: xBins * yBins }, (_, index) => ({
      xIndex: index % xBins,
      yIndex: Math.floor(index / xBins),
      count: 0,
    }));

    pairs.forEach((item) => {
      const xIndex = Math.min(xBins - 1, Math.max(0, Math.floor(((item.a - xDomain[0]) / (xDomain[1] - xDomain[0])) * xBins)));
      const yIndex = Math.min(yBins - 1, Math.max(0, Math.floor(((item.y - yDomainLocal[0]) / (yDomainLocal[1] - yDomainLocal[0])) * yBins)));
      cells[yIndex * xBins + xIndex].count += 1;
    });

    const maxCount = Math.max(...cells.map((cell) => cell.count), 1);
    const cellWidth = innerWidth / xBins;
    const cellHeight = innerHeight / yBins;
    cells.forEach((cell) => {
      if (!cell.count) {
        return;
      }
      const intensity = Math.sqrt(cell.count / maxCount);
      svg.appendChild(svgEl("rect", {
        x: margin.left + cell.xIndex * cellWidth,
        y: margin.top + (yBins - cell.yIndex - 1) * cellHeight,
        width: Math.max(0, cellWidth - 1),
        height: Math.max(0, cellHeight - 1),
        class: "joint-cell",
        opacity: 0.18 + intensity * 0.72,
      }));
    });

    pairs.forEach((item) => {
      const point = svgEl("circle", {
        cx: x(item.a),
        cy: y(item.y),
        r: 2.8,
        class: "joint-point",
      });
      const title = svgEl("title");
      const yName = useMidpointSlope ? midpointSlopeLabel() : "b";
      title.textContent = `${item.label}\na=${formatCoeff(item.a)}, ${yName}=${formatCoeff(item.y)}`;
      point.appendChild(title);
      svg.appendChild(point);
    });

    drawJointCorrelationLabel(svg, pairs, margin, useMidpointSlope);
    drawJointAxis(svg, xDomain, yDomainLocal, x, y, width, height, margin, innerWidth, innerHeight, useMidpointSlope);
    return svg;
  }

  function drawJointCorrelationLabel(svg, pairs, margin, useMidpointSlope) {
    const corr = correlation(pairs.map((item) => item.a), pairs.map((item) => item.y));
    const yName = useMidpointSlope ? "b+6a" : "b";
    const label = `corr(a,${yName}) ${formatCoeff(corr)}`;
    const labelGroup = svgEl("g", { class: "joint-fit-label-group" });
    labelGroup.appendChild(svgEl("rect", {
      x: margin.left + 8,
      y: margin.top + 8,
      width: useMidpointSlope ? 148 : 118,
      height: 25,
      rx: 5,
      class: "joint-fit-label-bg",
    }));
    const text = svgEl("text", {
      x: margin.left + 18,
      y: margin.top + 25,
      class: "joint-fit-label",
    });
    text.textContent = label;
    labelGroup.appendChild(text);
    svg.appendChild(labelGroup);
  }

  function drawJointAxis(svg, xDomain, yDomainLocal, x, y, width, height, margin, innerWidth, innerHeight, useMidpointSlope) {
    const zeroX = x(0);
    if (zeroX >= margin.left && zeroX <= margin.left + innerWidth) {
      svg.appendChild(svgEl("line", {
        x1: zeroX,
        x2: zeroX,
        y1: margin.top,
        y2: margin.top + innerHeight,
        class: "hist-zero",
      }));
    }

    const zeroY = y(0);
    if (zeroY >= margin.top && zeroY <= margin.top + innerHeight) {
      svg.appendChild(svgEl("line", {
        x1: margin.left,
        x2: margin.left + innerWidth,
        y1: zeroY,
        y2: zeroY,
        class: "hist-zero",
      }));
    }

    niceTicks(xDomain[0], xDomain[1], 5).forEach((tick) => {
      const tickX = x(tick);
      svg.appendChild(svgEl("line", {
        x1: tickX,
        x2: tickX,
        y1: margin.top + innerHeight,
        y2: margin.top + innerHeight + 5,
        class: "hist-tick",
      }));
      const text = svgEl("text", {
        x: tickX,
        y: height - 24,
        "text-anchor": "middle",
        class: "hist-axis-text",
      });
      text.textContent = formatCoeff(tick);
      svg.appendChild(text);
    });

    niceTicks(yDomainLocal[0], yDomainLocal[1], 5).forEach((tick) => {
      const tickY = y(tick);
      svg.appendChild(svgEl("line", {
        x1: margin.left - 5,
        x2: margin.left,
        y1: tickY,
        y2: tickY,
        class: "hist-tick",
      }));
      const text = svgEl("text", {
        x: margin.left - 9,
        y: tickY + 4,
        "text-anchor": "end",
        class: "hist-axis-text",
      });
      text.textContent = formatCoeff(tick);
      svg.appendChild(text);
    });

    svg.appendChild(svgEl("line", {
      x1: margin.left,
      x2: margin.left + innerWidth,
      y1: margin.top + innerHeight,
      y2: margin.top + innerHeight,
      class: "hist-axis",
    }));
    svg.appendChild(svgEl("line", {
      x1: margin.left,
      x2: margin.left,
      y1: margin.top,
      y2: margin.top + innerHeight,
      class: "hist-axis",
    }));

    const xLabel = svgEl("text", {
      x: margin.left + innerWidth / 2,
      y: height - 8,
      "text-anchor": "middle",
      class: "hist-axis-label",
    });
    xLabel.textContent = "a curvature";
    svg.appendChild(xLabel);

    const yLabel = svgEl("text", {
      x: 16,
      y: margin.top + innerHeight / 2,
      transform: `rotate(-90 16 ${margin.top + innerHeight / 2})`,
      "text-anchor": "middle",
      class: "hist-axis-label",
    });
    yLabel.textContent = useMidpointSlope ? `${midpointSlopeLabel()} midpoint slope` : "b slope";
    svg.appendChild(yLabel);
  }

  function paddedDomain(values) {
    let min = Math.min(...values);
    let max = Math.max(...values);
    if (min === max) {
      const delta = Math.max(Math.abs(min) * 0.25, 0.1);
      min -= delta;
      max += delta;
    }
    const pad = (max - min) * 0.08;
    return [min - pad, max + pad];
  }

  function makeBins(values, domain, count) {
    const width = (domain[1] - domain[0]) / count;
    const bins = Array.from({ length: count }, (_, index) => ({
      start: domain[0] + index * width,
      end: domain[0] + (index + 1) * width,
      count: 0,
    }));
    values.forEach((value) => {
      const index = Math.min(count - 1, Math.max(0, Math.floor((value - domain[0]) / width)));
      bins[index].count += 1;
    });
    return bins;
  }

  function mean(values) {
    return values.reduce((sum, value) => sum + value, 0) / values.length;
  }

  function sd(values) {
    if (values.length < 2) {
      return 0;
    }
    const avg = mean(values);
    const variance = values.reduce((sum, value) => sum + (value - avg) ** 2, 0) / (values.length - 1);
    return Math.sqrt(variance);
  }

  function correlation(xValues, yValues) {
    if (xValues.length < 2 || yValues.length < 2 || xValues.length !== yValues.length) {
      return 0;
    }
    const meanX = mean(xValues);
    const meanY = mean(yValues);
    let numerator = 0;
    let denomX = 0;
    let denomY = 0;
    xValues.forEach((value, index) => {
      const dx = value - meanX;
      const dy = yValues[index] - meanY;
      numerator += dx * dy;
      denomX += dx * dx;
      denomY += dy * dy;
    });
    const denominator = Math.sqrt(denomX * denomY);
    return denominator > 0 ? numerator / denominator : 0;
  }

  function yDomain(values, overlays) {
    const all = values.filter(Number.isFinite);
    overlays.forEach((series) => {
      if (!series) {
        return;
      }
      series.forEach((value) => {
        if (Number.isFinite(value)) {
          all.push(value);
        }
      });
    });

    if (!all.length) {
      return [-5, 30];
    }

    let min = Math.min(...all, 0, TARGET_BP);
    let max = Math.max(...all, 0, TARGET_BP);
    const pad = Math.max((max - min) * 0.16, 8);
    min -= pad;
    max += pad;
    if (min === max) {
      min -= 10;
      max += 10;
    }
    return [min, max];
  }

  function niceTicks(min, max, count) {
    const span = max - min;
    const step = niceStep(span / Math.max(1, count - 1));
    const start = Math.floor(min / step) * step;
    const end = Math.ceil(max / step) * step;
    const ticks = [];
    for (let value = start; value <= end + step * 0.5; value += step) {
      ticks.push(roundTick(value));
    }
    return ticks;
  }

  function niceStep(rawStep) {
    const power = 10 ** Math.floor(Math.log10(rawStep));
    const fraction = rawStep / power;
    let niceFraction = 1;
    if (fraction <= 1) {
      niceFraction = 1;
    } else if (fraction <= 2) {
      niceFraction = 2;
    } else if (fraction <= 5) {
      niceFraction = 5;
    } else {
      niceFraction = 10;
    }
    return niceFraction * power;
  }

  function roundTick(value) {
    return Math.abs(value) < 1e-10 ? 0 : Number(value.toFixed(8));
  }

  function showFitPanel(row) {
    el.fitPanel.hidden = false;
    const view = dateDisplayView(row);
    const coefficients = view.modifiedCoefficients;
    if (!hasCoefficients(coefficients)) {
      el.fitEquation.textContent = "Quadratic fit unavailable";
      el.fitDetails.textContent = "Need at least three non-missing modified points.";
      return;
    }

    const [a, b, c] = coefficients;
    el.fitEquation.textContent = `y = ${signedTerm(a, "x^2", true)} ${signedTerm(b, "x")} ${signedTerm(c, "")}`;
    el.fitDetails.textContent = "";
  }

  function hideFitPanel() {
    el.fitPanel.hidden = true;
    el.fitEquation.textContent = "";
    el.fitDetails.textContent = "";
  }

  function signedTerm(value, suffix, first) {
    const sign = value < 0 ? "-" : first ? "" : "+";
    const abs = Math.abs(value);
    const number = abs >= 100 ? abs.toFixed(1) : abs >= 10 ? abs.toFixed(2) : abs.toFixed(3);
    return suffix ? `${sign}${number}${suffix}` : `${sign}${number}`;
  }

  function renderEmpty(message) {
    el.chart.innerHTML = "";
    const box = document.createElement("div");
    box.className = "empty-state";
    box.textContent = message;
    el.chart.appendChild(box);
  }

  function showError(message) {
    el.errorBanner.textContent = message;
    el.errorBanner.hidden = false;
  }

  function hideError() {
    el.errorBanner.hidden = true;
    el.errorBanner.textContent = "";
  }

  function setSaveStatus(message) {
    el.saveStatus.textContent = message;
  }

  function svgEl(name, attrs) {
    const element = document.createElementNS("http://www.w3.org/2000/svg", name);
    Object.entries(attrs || {}).forEach(([key, value]) => {
      element.setAttribute(key, String(value));
    });
    return element;
  }

  function colorFor(index, total) {
    const hue = (205 + (index * 360) / Math.max(1, total)) % 360;
    return `hsl(${hue.toFixed(1)}, 62%, 45%)`;
  }

  function seriesLabel(values) {
    return HORIZONS.map((name, index) => {
      const value = values[index];
      return `${name}: ${Number.isFinite(value) ? `${formatBp(value)} bp` : "--"}`;
    }).join(", ");
  }

  function formatBp(value) {
    const abs = Math.abs(value);
    const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : 2;
    return value.toFixed(digits);
  }

  function formatCoeff(value) {
    const abs = Math.abs(value);
    if (abs >= 100) {
      return value.toFixed(1);
    }
    if (abs >= 10) {
      return value.toFixed(2);
    }
    if (abs >= 1) {
      return value.toFixed(3);
    }
    return value.toFixed(4);
  }

  function clamp(value, min, max) {
    return Math.min(Math.max(value, min), max);
  }

  function sourceSummary(rows) {
    if (!rows.length) {
      return "No eligible observations found";
    }
    return `${rows.length} eligible observations, ${rows[0].date} to ${rows[rows.length - 1].date}`;
  }
}());

    </script>
